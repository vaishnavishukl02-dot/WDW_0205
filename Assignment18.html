<!DOCTYPE html>
<html>
<head>
    
    <title>Assignment 18</title>
</head>
<body>

    <!-- Header -->
    <header style="background-color: #162473; color: white; text-align: center; padding: 15px;">
        <h1>ABC College Admission 2026</h1>
    </header>

    <!-- Main Content -->
    <main style="width: 65%; margin: 20px auto;">
        <h2>Courses and Fees</h2>

        <!-- Accessible Table -->
        <table border="1" cellspacing="0" cellpadding="6" width="100%">
            <caption>Available Courses</caption>
            <thead>
                <tr bgcolor="#e6e6e6">
                    <th scope="col">Course</th>
                    <th scope="col">Seats</th>
                    <th scope="col">Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>

        <br>

        <!-- Validated Form -->
        <form action="#" method="post">
            <fieldset>
                <legend>Application Form</legend>

                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" size="35" required minlength="2">
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" size="35" required>
                </p>

                <p>
                    <label for="course">Course:</label><br>
                    <select id="course" name="course" required>
                        <option value="btech" selected>B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select>
                </p>

                <p>
                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="3" cols="50" required></textarea>
                </p>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>

    <!-- Footer -->
    <footer style="background-color: #162473; color: white; text-align: center; padding: 8px;">
        &copy; 2026 ABC College
    </footer>

</body>
</html>
